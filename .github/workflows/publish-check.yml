name: Publish vantage-check

# The vantage-check CLI is an independently versioned, compiled single-file
# binary. Pushing a `vantage-check@<version>` tag builds it for every supported
# platform and publishes the results:
#   - binaries on the GitHub release (install with curl)
#   - platform-tagged wheels on PyPI (install with uvx)
#
# One runner does all of it. vantage-check is TypeScript compiled with `bun
# build --compile`, and bun cross-compiles every target from a single host — so
# unlike the Go binary in publish.yml, and unlike this workflow's own Node SEA
# ancestor, there is no reason to pay for a runner per platform. bun downloads
# each target's runtime the first time it compiles for it, so this job needs
# network access (fine on a GitHub runner; it fails in an offline sandbox).
#
# The trade of collapsing the matrix: only the host target can be executed here.
# See the smoke-test step.
#
# The PyPI step additionally requires the `vantage-check` project to exist on
# PyPI with GitHub OIDC trusted publishing configured for this repo — an owner
# action outside this repo. Until that is done the step fails, but the release
# and its binaries are already published by then, so the curl install keeps
# working either way.
on:
  push:
    tags:
      - "vantage-check@*"

permissions:
  contents: write # create the GitHub release + upload the archives

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise (bun + node)
        uses: jdx/mise-action@v4

      # A tag that disagrees with the manifest would ship a binary that reports
      # a version nobody can install, since build.ts stamps package.json's
      # version into the executable and the wheel filename comes from the tag.
      - name: Check the tag against the manifest
        id: ver
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#vantage-check@}"
          manifest="$(node -p "require('./packages/vantage-check/package.json').version")"
          if [ "$version" != "$manifest" ]; then
            echo "tag ${GITHUB_REF_NAME} disagrees with packages/vantage-check/package.json (${manifest})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing vantage-check ${version}"

      - name: Install dependencies
        run: |
          set -euo pipefail
          # vantage-check imports vantage-md's TypeScript source, so that
          # package's own dependencies must resolve at bundle time.
          ( cd packages/vantage-md && npm ci )
          ( cd packages/vantage-check && npm ci )

      # The only target this runner can actually execute. Everything else is
      # cross-compiled below and shipped unexecuted — that is the real cost of
      # collapsing the per-platform matrix, and it is why this step exists: it
      # proves the bundle runs standalone (no Node, no node_modules) on at least
      # one platform before any of the artifacts are published.
      - name: Build for this host and smoke-test it
        run: |
          set -euo pipefail
          cd packages/vantage-check
          bun run build
          bin="dist/vantage-check"
          "$bin" version
          test -n "$("$bin" style-guide)" || { echo "style-guide printed nothing"; exit 1; }
          # Dogfooding: the checker we hand to other people's agents has to pass
          # the tree it ships from.
          "$bin" check ../../userguide ../../docs

      - name: Cross-compile every target, archive, and build wheels
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          root="$GITHUB_WORKSPACE"
          mkdir -p "$root/archives" "$root/wheels"
          staging="$(mktemp -d)"
          cd packages/vantage-check

          # Each row of the table below is: bun target | os | arch | PyPI
          # platform tag. The Linux wheels are tagged manylinux rather than
          # linux_*, because PyPI rejects a bare `linux_x86_64` upload outright.
          #
          # Windows is deliberately not a target (docs/design/pypi-distribution.md
          # §4.4): nothing tests the CLI there, and its absence is what lets this
          # loop assume one binary name and one archive format. Re-adding a
          # `win_*` row means restoring the `.exe` naming and the zip branch, and
          # build-wheel.py will reject the tag until someone does.
          #
          # The loop reads that table on fd 3, so `bun` and `python3` in the body
          # keep the real stdin and cannot swallow a row.
          while read -r target os arch pytag <&3; do
            [ -n "$target" ] || continue
            echo "::group::${target}"
            rm -rf dist
            bun run build --target "$target"

            # Assert the file we expect is there, so a change in bun's output
            # naming fails loudly here instead of shipping an empty archive and
            # an unusable wheel.
            exe="vantage-check"
            binary="dist/${exe}"
            test -f "$binary" || { echo "expected ${binary} after building ${target}, got:"; ls -l dist; exit 1; }

            rm -rf "$staging"
            mkdir -p "$staging"
            cp "$binary" "$staging/${exe}"
            cp "$root/LICENSE" "$root/README.md" "$staging/"

            name="vantage-check_${version}_${os}_${arch}"
            tar -czf "$root/archives/${name}.tar.gz" -C "$staging" "$exe" LICENSE README.md

            # Wheels land in their own directory. The publish step must be
            # handed *.whl only — packages-dir on dist/ would try to upload the
            # bare ~90 MB binary sitting next to them.
            python3 "$root/scripts/build-wheel.py" \
              --binary "$binary" \
              --distribution vantage-check \
              --script vantage-check \
              --summary "Vantage's Markdown conventions, and a check that a document really renders" \
              --readme README.md \
              --platform-tag "$pytag" \
              --version "$version" \
              --out-dir "$root/wheels"
            echo "::endgroup::"
          done 3<<'TARGETS'
          bun-linux-x64     linux    x64    manylinux_2_28_x86_64
          bun-linux-arm64   linux    arm64  manylinux_2_28_aarch64
          bun-darwin-x64    darwin   x64    macosx_11_0_x86_64
          bun-darwin-arm64  darwin   arm64  macosx_11_0_arm64
          TARGETS

          ls -l "$root/archives" "$root/wheels"

      # The CLI's PyPI path has never run — no tag, no project — so its first
      # release is also its first execution. Prove the host wheel installs and
      # the command works before uploading, rather than after.
      - name: Smoke-test the host wheel
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          python3 -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet \
            "wheels/vantage_check-${version}-py3-none-manylinux_2_28_x86_64.whl"
          /tmp/wheelcheck/bin/vantage-check --version
          /tmp/wheelcheck/bin/vantage-check style-guide | head -5

      # `gh release create` rather than a third-party action, matching
      # publish.yml. Creating the release fires `release: published`, which
      # publish.yml also listens for — its build job is guarded against package
      # tags precisely because of this. Do not remove that guard.
      - name: Create the GitHub release and attach the archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "vantage-check ${version}" \
              --notes "Standalone \`vantage-check\` binaries. Install with \`uvx vantage-check\`, or download the archive for your platform."
          fi
          gh release upload "$GITHUB_REF_NAME" archives/* --clobber

      - name: Upload the wheels for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheels/*.whl
          if-no-files-found: error

  # Publishing is its own job for two reasons: the release and its archives are
  # already up by the time it runs, so a PyPI failure costs only the wheels; and
  # the `pypi` environment gates just this step rather than the whole release —
  # which is also what the trusted-publisher config on PyPI names. Its three
  # GitHub fields are `mschulkind-oss` / `vantage` / `publish-check.yml`, plus
  # environment `pypi`; the repository field takes the bare name, not owner/name.
  pypi:
    needs: [release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) — no token
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: wheels/

      - name: Publish the wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
