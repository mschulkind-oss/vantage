name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buildinfo reads vcs metadata

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Build vantage-md package
        run: cd packages/vantage-md && npm ci && npx tsup

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Download Go modules
        run: go mod download

      # Build first so the frontend is bundled into web/dist; the embed-dependent
      # server/static tests then run for real in check-ci instead of skipping.
      - name: Build
        run: just build

      - name: Check (lint, type-check, test)
        run: just check-ci
