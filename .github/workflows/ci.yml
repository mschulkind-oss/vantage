name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buildinfo reads vcs metadata

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Build vantage-md package
        run: cd packages/vantage-md && npm ci && npx tsup

      # `just check-ci` compiles this package into a standalone binary with bun
      # (which mise installs from mise.toml) and runs it over the repo's own
      # documentation, so the gate covers the artifact we ship and not just the
      # source it is built from. The install has to come first: vantage-check
      # imports vantage-md's TypeScript source, so both packages' dependencies
      # must resolve at bundle time.
      - name: Install vantage-check dependencies
        run: cd packages/vantage-check && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Download Go modules
        run: go mod download

      # Build first so the frontend is bundled into web/dist; the embed-dependent
      # server/static tests then run for real in check-ci instead of skipping.
      - name: Build
        run: just build

      # `just build` ran web-sync, so anything changed under web/dist means the
      # committed export does not match the sources — a frontend change landed
      # without `just web-sync`. That matters because the committed export is
      # what `go install …@latest` and the PyPI wheels embed, and a stale one
      # fails silently: the app renders, just an older version of it.
      #
      # The build is byte-reproducible at these pinned toolchain versions
      # (verified 2026-09-01: a rebuild over the committed export changed
      # nothing). If that ever stops holding on some platform, relax this to a
      # warning rather than deleting it.
      - name: Assert web/dist matches its sources
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            echo "web/dist is stale — run 'just web-sync' and commit the result:"
            git status --porcelain -- web/dist
            exit 1
          fi

      - name: Check (lint, type-check, test, self-check the docs)
        run: just check-ci
