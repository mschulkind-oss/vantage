name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # The commit-message policy the local hooks enforce, run where a contribution
  # can actually be seen. `core.hooksPath` is per-clone local config, so a fork
  # that never ran `just setup` has no hooks at all — which is how a PR arrived
  # carrying AI attribution trailers with nothing anywhere reporting it.
  #
  # Same script the hooks call, so the two cannot disagree about the policy.
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the range below has to be reachable

      - name: Check commit messages
        env:
          # On a pull request, exactly the commits it contributes. On a push,
          # what that push added — `before` is all-zeros for a new branch and
          # unreachable after a force-push, so fall back to the tip alone
          # rather than failing the job on a range git cannot read.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            exec scripts/check-commit-messages.sh "$BASE..$HEAD"
          fi
          echo "no readable base ($BASE) — checking $HEAD alone"
          exec scripts/check-commit-messages.sh "$HEAD~1..$HEAD"

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buildinfo reads vcs metadata

      - name: Install mise
        uses: jdx/mise-action@v4

      # One workspace, one lockfile, one install — this covers all three
      # packages. `just check-ci` then compiles vantage-check into a standalone
      # binary with bun (which mise installs from mise.toml) and runs it over
      # the repo's own documentation, so the gate covers the artifact we ship
      # and not just the source it is built from. That needs vantage-md's
      # dependencies resolvable too, since vantage-check bundles its source.
      - name: Install the npm workspace
        run: npm ci

      - name: Build vantage-md package
        run: npm exec --workspace vantage-md -- tsdown

      - name: Download Go modules
        run: go mod download

      # Build first so the frontend is bundled into web/dist; the embed-dependent
      # server/static tests then run for real in check-ci instead of skipping.
      - name: Build
        run: just build

      - name: Check (lint, type-check, test, self-check the docs)
        run: just check-ci

  # The browser suite: layout and behaviour only a real browser can check.
  # Playwright's webServer config self-hosts everything (a real `vantage
  # serve` behind a real Vite dev server), so the job needs the toolchain
  # and the npm workspace, nothing else. Ubuntu only — the projects run
  # chromium alone, and one OS exercising the DOM is what this suite is for.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buildinfo reads vcs metadata
      - name: Install mise
        uses: jdx/mise-action@v4
      - name: Install the npm workspace
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        # just e2e builds the git fixture the commit-info spec serves
        # before the suite boots its servers (scripts/e2e-fixture.sh).
        run: just e2e
