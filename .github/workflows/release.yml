name: Release

on:
  push:
    tags:
      - "v*"            # Full release: v0.3.5 — Go binaries + Homebrew tap
      - "vantage-md@*"  # npm-only release: vantage-md@0.1.5

permissions:
  contents: write  # gh release create / goreleaser
  id-token: write  # npm provenance (OIDC trusted publishing)

jobs:
  # --- npm publish for the standalone vantage-md library ---
  # vantage-md is an independent Markdown-rendering package with its own
  # version. Both v* and vantage-md@* tags pass through here; the publish
  # itself is skipped when the version is already on the registry.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Setup Node with npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Build vantage-md
        run: cd packages/vantage-md && npm ci && npx tsup

      # Skip if the version in package.json is already on the registry. This
      # lets `v*` tags (Go releases) ride past a stale npm version without
      # failing the whole workflow; only `vantage-md@*` tags or v* tags that
      # also bumped npm actually publish.
      - name: Check if npm version needs publishing
        id: npm_check
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./packages/vantage-md/package.json').version")
          if npm view "vantage-md@${pkg_version}" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "vantage-md@${pkg_version} is already on npm; skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Publishing vantage-md@${pkg_version}."
          fi

      - name: Publish vantage-md to npm
        if: steps.npm_check.outputs.skip == 'false'
        run: cd packages/vantage-md && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # --- Go cross-compile + GitHub release + Homebrew tap (only for v* tags) ---
  # GoReleaser's `before` hook builds the Vite frontend and copies it into
  # web/dist so the embedded bundle is the real one, then cross-compiles the
  # vantage binary for linux/darwin (amd64+arm64), attaches the archives to the
  # GitHub release, and pushes the updated formula to the Homebrew tap.
  goreleaser:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # goreleaser needs the full history + tags

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Download Go modules
        run: go mod download

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
