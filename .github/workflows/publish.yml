name: Publish

# One version, one tag, one run. Pushing `v<semver>` releases everything this
# repo ships: the `vantage` server and the `vantage-check` CLI as one archive per
# platform, both as PyPI wheels, the `vantage-md` library to npm, and a Homebrew
# formula that installs both binaries.
#
# It was three workflows and three tag namespaces until 2026-09-01 (`v*`,
# `vantage-md@*`, `vantage-check@*`), which meant three release gestures and
# three versions to reconcile. The version now comes from the tag alone —
# nothing reads a manifest to decide what to publish, so nothing can disagree
# with it.
#
# The tag filter is `v[0-9]*` rather than `v*` and that is load-bearing: under
# the old `release: [published]` trigger, which takes no tag filter, any release
# created for a `vantage-…@…` tag also woke this workflow, and
# `${GITHUB_REF_NAME#v}` yielded `antage-check@0.1.0`. A runtime guard held that
# off; the filter makes it unreachable, since `[0-9]` cannot match the `a` of
# `vantage`.
#
# A manual dispatch re-runs only the tap update (the binaries must already be on
# the release), to backfill or recover a formula without cutting a release.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version to refresh the Homebrew tap for, e.g. 0.4.0 (binaries must already be on the release)."
        required: true
        type: string

permissions:
  contents: write # upload release assets

jobs:
  # Create the release the other jobs attach to. Its own job because `build` is a
  # four-leg matrix, and four legs racing to create one release is three losers.
  # `gh release view ||` keeps a re-run idempotent.
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "vantage ${version}" \
              --generate-notes

  # Build both binaries for one platform, ship them as one archive, and wrap each
  # in its own PyPI wheel.
  build:
    # No tag guard needed: the `v[0-9]*` filter on the trigger is the guard.
    # `workflow_dispatch` skips this job so `brew` can run standalone.
    if: github.event_name == 'push'
    needs: [create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `server_pytags` is the set of PyPI platform tags the Go binary is
          # valid for, space-separated: CGO_ENABLED=0 makes it static, so one
          # Linux binary satisfies glibc and musl both — a second tag, not a
          # second build — and the manylinux floor is as low as PyPI accepts
          # because nothing is linked. `cli_pytag` is higher (2_28) because bun's
          # runtime does link glibc. macOS claims 11_0 on both arches, which is
          # Go's own floor; 10_9 would install on machines it cannot run on.
          - goos: linux
            goarch: amd64
            bun_target: bun-linux-x64
            server_pytags: "manylinux_2_17_x86_64 musllinux_1_2_x86_64"
            cli_pytag: manylinux_2_28_x86_64
          - goos: linux
            goarch: arm64
            bun_target: bun-linux-arm64
            server_pytags: "manylinux_2_17_aarch64 musllinux_1_2_aarch64"
            cli_pytag: manylinux_2_28_aarch64
          - goos: darwin
            goarch: amd64
            bun_target: bun-darwin-x64
            server_pytags: "macosx_11_0_x86_64"
            cli_pytag: macosx_11_0_x86_64
          - goos: darwin
            goarch: arm64
            bun_target: bun-darwin-arm64
            server_pytags: "macosx_11_0_arm64"
            cli_pytag: macosx_11_0_arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mise (go, node, bun)
        uses: jdx/mise-action@v4

      - name: Read the version from the tag
        id: ver
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing everything as ${version}"

      - name: Install dependencies
        run: |
          set -euo pipefail
          # vantage-check bundles vantage-md's TypeScript source, so that
          # package's own dependencies must resolve at bundle time.
          npm ci

      # The tag is the only source of truth for the version. build.ts stamps
      # package.json's version into the CLI binary, so this is what makes
      # `vantage-check --version` agree with the release it shipped in.
      - name: Stamp the version into both manifests
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          for pkg in packages/vantage-md packages/vantage-check; do
            npm version "$version" --no-git-tag-version --allow-same-version --workspace "$pkg"
          done

      - name: Build the vantage-md library
        run: npm exec --workspace vantage-md -- tsup

      - name: Build and bundle the frontend
        run: |
          set -euo pipefail
          npm run build --workspace frontend
          rm -rf web/dist && cp -r frontend/dist web/dist
          test -f web/dist/index.html # an empty embed ships a placeholder page

      - name: Cross-compile the server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/mschulkind-oss/vantage/internal/buildinfo.version=${version} \
              -X github.com/mschulkind-oss/vantage/internal/buildinfo.commit=${GITHUB_SHA::7}" \
            -o vantage ./cmd/vantage

      - name: Cross-compile the CLI
        run: |
          set -euo pipefail
          ( cd packages/vantage-check && bun run build --target "${{ matrix.bun_target }}" )
          cp packages/vantage-check/dist/vantage-check vantage-check

      # One archive per platform carrying both binaries, so the Homebrew formula
      # installs both from a single url and sha — polyclav's shape.
      - name: Archive both binaries and attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          name="vantage_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "$name" vantage vantage-check LICENSE README.md
          gh release upload "${GITHUB_REF_NAME}" "$name" --clobber

      # Each wheel wraps the binary that was just archived, rather than a second
      # build of it, so PyPI and the release carry the same bytes
      # (docs/design/pypi-distribution.md §4.5).
      - name: Build the wheels
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          mkdir -p wheels
          for pytag in ${{ matrix.server_pytags }}; do
            python3 scripts/build-wheel.py \
              --binary vantage \
              --distribution vantage-md \
              --script vantage \
              --alias vantage-md \
              --summary "A beautiful local Markdown viewer with live reload and Git awareness" \
              --readme README.md \
              --platform-tag "$pytag" \
              --version "$version" \
              --out-dir wheels
          done
          python3 scripts/build-wheel.py \
            --binary vantage-check \
            --distribution vantage-check \
            --script vantage-check \
            --summary "Vantage's Markdown conventions, and a check that a document really renders" \
            --readme packages/vantage-check/README.md \
            --platform-tag "${{ matrix.cli_pytag }}" \
            --version "$version" \
            --out-dir wheels
          ls -l wheels

      # Only this leg's binaries can run on the runner, so only this leg can
      # prove any of it works. `uvx vantage-md` resolving without --from is the
      # whole point of the alias, and the alias is a generated console script —
      # exactly the class of thing that looks right in a zip and fails on first
      # use. The CLI also checks this repo's own docs: the checker we hand to
      # other people's agents has to pass the tree it ships from.
      - name: Smoke-test the host wheels
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          python3 -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet \
            "wheels/vantage_md-${version}-py3-none-manylinux_2_17_x86_64.whl" \
            "wheels/vantage_check-${version}-py3-none-manylinux_2_28_x86_64.whl"
          /tmp/wheelcheck/bin/vantage --version | grep -F "${version}"
          /tmp/wheelcheck/bin/vantage-md --version   # the alias execs the binary
          /tmp/wheelcheck/bin/vantage-check --version | grep -F "${version}"
          /tmp/wheelcheck/bin/vantage-check check userguide docs

      - name: Upload the wheels for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wheels/*.whl
          if-no-files-found: error

  # Publish both projects to PyPI — `vantage-md` (the server) and `vantage-check`
  # (the CLI). Separate distributions on purpose: one name identifies one
  # artifact, and an agent linting a file should not fetch a server
  # (docs/design/pypi-distribution.md §6). They share this one version.
  #
  # Trusted publishing (OIDC), no token. Both projects must name THIS workflow
  # file (`publish.yml`) and the `pypi` environment as a trusted publisher.
  #
  # A separate job on purpose: the archives are attached before it runs and the
  # tap job is a sibling rather than a dependent, so a PyPI failure costs the
  # release nothing but its wheels.
  pypi:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download every leg's wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels/

      - uses: astral-sh/setup-uv@v7

      # One invocation per project: a minted token is scoped to the project it
      # was minted for, so mixing both projects' wheels into one upload cannot
      # work.
      - name: Publish vantage-md
        run: uv publish wheels/vantage_md-*.whl --check-url https://pypi.org/simple/

      - name: Publish vantage-check
        run: uv publish wheels/vantage_check-*.whl --check-url https://pypi.org/simple/

  # Publish the Markdown pipeline to npm at the same version. This is the library
  # form of `vantage-md`; the PyPI project of that name is the executable server,
  # and the registry is what says which one you get.
  npm:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node with the npm registry
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Build vantage-md at the tag's version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm ci
          npm version "$version" --no-git-tag-version --allow-same-version --workspace vantage-md
          npm exec --workspace vantage-md -- tsup

      - name: Publish to npm
        run: npm publish --provenance --access public --workspace vantage-md
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Regenerate the Homebrew formula from the released archives and push it to the
  # tap. Runs after a successful build on a tag push, or standalone on a manual
  # dispatch (always() lets it run when build is skipped).
  brew:
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Updating Homebrew tap for vantage ${version}"

      - name: Check out vantage (for the formula generator)
        uses: actions/checkout@v7

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: mschulkind-oss/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate the formula
        run: ./scripts/update-brew-tap.sh "${{ steps.version.outputs.version }}" tap

      - name: Commit and push to the tap
        run: |
          set -euo pipefail
          cd tap
          git config user.name "vantage release bot"
          git config user.email "noreply@github.com"
          git add Formula/vantage.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "vantage ${{ steps.version.outputs.version }}"
          git push
