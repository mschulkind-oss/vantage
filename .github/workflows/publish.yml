name: Publish

# Mirrors the release flow: publishing a GitHub Release builds the binaries,
# attaches them to the release, and updates the Homebrew tap. A manual dispatch
# re-runs only the tap update (the binaries must already be on the release) to
# recover or backfill a formula without cutting a new release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version to refresh the Homebrew tap for, e.g. 0.4.0 (binaries must already be on the release)."
        required: true
        type: string

permissions:
  contents: write # upload release assets

jobs:
  # Build the vantage binary for each platform with the frontend embedded and
  # attach the archives to the GitHub release.
  build:
    # Only the *app's* own `v<semver>` releases.
    #
    # `release: [published]` takes no tag filter, so this workflow also fires for
    # the releases publish-check.yml creates for `vantage-check@<version>` tags
    # (and would for any future `<package>@<version>` release). On such a tag the
    # `version="${GITHUB_REF_NAME#v}"` below strips the `v` of *v*antage-check and
    # yields `antage-check@0.1.0`; the job then attaches nonsense archives to the
    # wrong release and the `brew` job regenerates Formula/vantage.rb from URLs
    # that do not exist and pushes it to the public tap, breaking
    # `brew install vantage` for everyone until someone reverts the tap.
    #
    # Guard on `github.ref_name` specifically, because that is the value that
    # goes wrong. `startsWith(…, 'v')` alone is not enough — `vantage-check@…`
    # and `vantage-md@…` both start with `v`, which is the whole trap — so the
    # `@` test is what actually separates a package tag from `v0.4.0`.
    #
    # The `brew` job needs no guard of its own: with `build` skipped,
    # `needs.build.result` is 'skipped', and on a release event
    # `github.event_name` is not 'workflow_dispatch', so its condition is false.
    # The manual `workflow_dispatch` path is untouched and still runs `brew`.
    if: github.event_name == 'release' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '@')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `pytags` is the set of PyPI platform tags this leg's binary is valid
          # for, space-separated. CGO_ENABLED=0 makes it static, so one Linux
          # binary satisfies glibc and musl both — a second tag, not a second
          # build. manylinux_2_17 rather than _2_28 for the same reason: nothing
          # is linked, so the floor is as low as PyPI will accept.
          # macOS claims 11_0 on both arches because that is Go's own floor;
          # claiming 10_9 would install on machines the binary cannot run on.
          - { goos: linux, goarch: amd64, pytags: "manylinux_2_17_x86_64 musllinux_1_2_x86_64" }
          - { goos: linux, goarch: arm64, pytags: "manylinux_2_17_aarch64 musllinux_1_2_aarch64" }
          - { goos: darwin, goarch: amd64, pytags: "macosx_11_0_x86_64" }
          - { goos: darwin, goarch: arm64, pytags: "macosx_11_0_arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Build the vantage-md library
        run: cd packages/vantage-md && npm ci && npx tsup

      - name: Build and bundle the frontend
        run: |
          cd frontend && npm ci && npm run build && cd ..
          rm -rf web/dist && cp -r frontend/dist web/dist

      - name: Cross-compile and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/mschulkind-oss/vantage/internal/buildinfo.version=${version} \
              -X github.com/mschulkind-oss/vantage/internal/buildinfo.commit=${GITHUB_SHA::7}" \
            -o vantage ./cmd/vantage
          tar -czf "vantage_${version}_${GOOS}_${GOARCH}.tar.gz" vantage LICENSE README.md

      - name: Upload archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" vantage_*.tar.gz --clobber

      # PyPI is the server's fourth channel, beside the archive, the tap and
      # `go install` (docs/design/pypi-distribution.md). The wheel wraps the
      # binary built above rather than compiling its own, so what PyPI serves is
      # byte-identical to what the release serves — which is the whole reason
      # this uses scripts/build-wheel.py instead of a tool that builds for
      # itself (§4.5 there).
      - name: Build the wheels
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p wheels
          for pytag in ${{ matrix.pytags }}; do
            python3 scripts/build-wheel.py \
              --binary vantage \
              --distribution vantage-md \
              --script vantage \
              --alias vantage-md \
              --summary "A beautiful local Markdown viewer with live reload and Git awareness" \
              --readme README.md \
              --platform-tag "$pytag" \
              --version "$version" \
              --out-dir wheels
          done
          ls -l wheels

      # Only this leg's binary can run on the runner, so only this leg can prove
      # the wheel is installable and both of its commands work. `uvx vantage-md`
      # resolving without --from is the whole point of the alias, and the alias
      # is a generated console script — exactly the class of thing that looks
      # right in a zip and fails on first use.
      - name: Smoke-test the host wheel
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet \
            "wheels/vantage_md-${version}-py3-none-manylinux_2_17_x86_64.whl"
          /tmp/wheelcheck/bin/vantage --version
          /tmp/wheelcheck/bin/vantage-md --version   # the alias execs the binary
          /tmp/wheelcheck/bin/vantage --version | grep -F "${version}"

      - name: Upload the wheels for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wheels/*.whl
          if-no-files-found: error

  # Publish the wheels built above to PyPI under `vantage-md` — the same name the
  # npm library uses, because the registry says which form you get (that doc's
  # P1). Trusted publishing (OIDC), no token; it needs the `vantage-md` project
  # on PyPI to have a trusted publisher configured for this workflow, which is an
  # owner action outside this repo.
  #
  # A separate job on purpose: the archives and the tap are already published by
  # the time this runs, so a PyPI failure costs the release nothing but its
  # wheels.
  pypi:
    if: github.event_name == 'release' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '@')
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download every leg's wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels/

      - uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish wheels/*.whl --check-url https://pypi.org/simple/

  # Regenerate the Homebrew formula from the released archives and push it to the
  # tap. Runs after a successful build on release events, or standalone on a
  # manual dispatch (always() lets it run when build is skipped).
  brew:
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build.result == 'success')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Updating Homebrew tap for vantage ${version}"

      - name: Check out vantage (for the formula generator)
        uses: actions/checkout@v7

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: mschulkind-oss/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate the formula
        run: ./scripts/update-brew-tap.sh "${{ steps.version.outputs.version }}" tap

      - name: Commit and push to the tap
        run: |
          set -euo pipefail
          cd tap
          git config user.name "vantage release bot"
          git config user.email "noreply@github.com"
          git add Formula/vantage.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "vantage ${{ steps.version.outputs.version }}"
          git push
