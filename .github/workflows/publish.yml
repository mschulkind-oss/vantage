name: Publish

# Recovery / backfill entry point. The normal release path runs from a pushed
# `v*` tag (see release.yml) and produces the GitHub release archives plus the
# Homebrew tap update via GoReleaser. This workflow re-runs that same GoReleaser
# release for an existing tag — use it to recover a partially-failed release or
# to backfill the Homebrew tap without cutting a new tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.4.0"
        required: true
        type: string

permissions:
  contents: write  # gh release / goreleaser
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing vantage ${tag}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0  # goreleaser needs the full history + tags

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Download Go modules
        run: go mod download

      # GoReleaser's `before` hook builds the Vite frontend and bundles it into
      # web/dist, then cross-compiles the vantage binary for linux/darwin
      # (amd64+arm64), (re)uploads the archives to the GitHub release, and
      # updates the Homebrew tap formula. `--clean` makes the run idempotent.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
