version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # @vitejs/plugin-react 6 requires peer vite@^8; we're on vite@^7.
      # Revisit together with a Vite 7->8 upgrade.
      - dependency-name: "@vitejs/plugin-react"
        versions: ["6.x"]

  - package-ecosystem: "npm"
    directory: "/packages/vantage-md"
    schedule:
      interval: "weekly"
    ignore:
      # TS 7 breaks tsup's bundled rollup-plugin-dts (pinned to typescript 5.7.3).
      # tsc --noEmit passes; the DTS build crashes. Revisit when tsup supports TS 7.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
