version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # One entry for the whole npm workspace. There is a single root lockfile, so
  # there is nothing per-directory left to update — and nothing left to drift:
  # katex and mermaid hoist to one copy shared by the viewer and the CLI, which
  # is what packages/vantage-check/test/deps.test.ts now asserts.
  #
  # It was three entries against three lockfiles, and the shared engines could
  # only agree by coincidence of when each was last regenerated. They did not:
  # katex diverged (fixed by hand in 4ec164ce) and mermaid diverged again as
  # #73, which no rebase could fix because vantage-check had no entry at all.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 is blocked on typescript-eslint, not on us. Its latest
      # (8.69.0, 2026-08-31) declares `typescript: >=4.8.4 <6.1.0` and refuses
      # to run with "typescript-eslint does not support TS 7.0."; no published
      # version, canary included, names 7.x. We lint at --max-warnings 0 in all
      # three packages, so this is a hard stop rather than a warning.
      #
      # This ignore previously blamed tsup's bundled rollup-plugin-dts, which
      # was also true and is now fixed (c0e70d5d moved the dts build to
      # tsdown, whose peer range names 7.x and which builds clean under 7.0.2).
      # Lift this when typescript-eslint ships a release naming 7.x — that is
      # the only remaining blocker.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
