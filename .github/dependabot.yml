version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # One entry for the whole npm workspace. There is a single root lockfile, so
  # there is nothing per-directory left to update — and nothing left to drift:
  # katex and mermaid hoist to one copy shared by the viewer and the CLI, which
  # is what packages/vantage-check/test/deps.test.ts now asserts.
  #
  # It was three entries against three lockfiles, and the shared engines could
  # only agree by coincidence of when each was last regenerated. They did not:
  # katex diverged (fixed by hand in 4ec164ce) and mermaid diverged again as
  # #73, which no rebase could fix because vantage-check had no entry at all.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @vitejs/plugin-react 6 requires peer vite@^8; we're on vite@^7.
      # Revisit together with a Vite 7->8 upgrade.
      - dependency-name: "@vitejs/plugin-react"
        versions: ["6.x"]
      # TS 7 breaks tsup's bundled rollup-plugin-dts (pinned to typescript 5.7.3).
      # tsc --noEmit passes; the DTS build crashes. Revisit when tsup supports TS 7.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
