# Vantage Daemon Configuration
#
# This file configures the Vantage daemon to serve multiple directories.
# Each repository will appear as a top-level item in the sidebar.

# Server settings
host = "127.0.0.1"
port = 8000

# Extra hostnames allowed to open the live-reload WebSocket. Loopback names
# (localhost, 127.0.0.1, ::1) are always allowed. Set this when reaching Vantage
# under a non-localhost name — e.g. a machine's DNS name over a tunnel — so the
# browser's Origin is accepted instead of rejected with 403. Bare hostnames, no
# scheme or port. Accepts a string or an array.
# allowed_origins = ["my-machine", "my-machine.local"]

# Log level for vantage logging.  One of: DEBUG, INFO, WARNING, ERROR.
# Can be overridden at runtime with the VANTAGE_LOG_LEVEL env var.
# log_level = "INFO"

# Directories to exclude from file listings and recent files.
# These are filtered out of the sidebar, file picker, and recent files.
# Defaults (if omitted): node_modules, .venv, venv, __pycache__,
#   .pytest_cache, .mypy_cache, .ruff_cache, .egg-info, .tox, .nox,
#   dist, build, .cache, .git, .hg, .svn
#
# To override the defaults with your own list:
# exclude_dirs = ["node_modules", ".venv", "vendor"]

# Performance tuning for very large repos.
# walk_max_depth: limit how deep to scan for untracked markdown files.
#   Default: no limit (all depths scanned).
#   Set to e.g. 5 if repos have enormous deeply-nested non-markdown trees.
# walk_max_depth = 5
#
# walk_timeout: timeout in seconds for the git ls-files subprocess that
#   discovers untracked files. Default: 30 seconds.
# walk_timeout = 30.0

# Ignore files: vantage reads two optional gitignore-style files to hide
# noisy paths from the sidebar, file search, and live-reload watcher:
#   ~/.config/vantage/ignore   (user-level, every repo)
#   <repo>/.vantageignore      (per-workspace, checked in)
# Both files use full gitignore syntax (**, negation with !, comments).
# Set use_ignore_files = false to disable both file-backed layers. The
# watcher-only defaults below still apply unless you replace them.
# use_ignore_files = true

# Live-reload watcher defaults: gitignore-style patterns the watcher prunes
# before user/workspace ignore files, so generated dependency trees do not
# consume one OS watch per directory. A later ~/.config/vantage/ignore or
# .vantageignore negation can restore one, e.g. !target/. Set an empty list to
# disable these watcher-only defaults. This does not affect listings or recents.
# watcher_ignore_defaults = [".yolo/", "node_modules/", ".venv/", "venv/", "target/"]

# Source directories: parent directories that are automatically scanned
# for git repos.  Any subdirectory containing a .git folder is added as
# a repo (using the directory name).  Repos already listed in [[repos]]
# are not duplicated.  The scan runs at startup and every 30 seconds after
# it, so a repo cloned into one of these directories is served without a
# restart, and one whose directory is gone stops being served.  Repos listed
# in [[repos]] are never dropped this way.  This is off by default —
# uncomment to enable.
#
# source_dirs = ["~/code", "~/projects"]

# Color theme: the palette light and dark mode are drawn in, for every browser
# until its reader picks another under "Colors" in the settings menu (a choice
# made there always wins).  "catppuccin" is built in; your own theme is
# ~/.config/vantage/themes/<id>.css, named here by <id>.  This also outranks a
# theme a repository offers in its own .vantage.toml — a repository may suggest a
# palette, never impose one — so set it here to fix yours everywhere.  Omitted,
# the repository's offer applies if it makes one; "default" is the built-in look
# either way.  Read only from ~/.config/vantage/config.toml, and only at
# startup — restart after changing it.  See userguide/guides/themes.md.
# theme = "catppuccin"

# Repositories to serve
# Each repo needs a unique name (used in URLs) and a path to the directory.
#
# Example:
# [[repos]]
# name = "notes"
# path = "~/Documents/notes"
#
# [[repos]]
# name = "work"
# path = "~/work/documentation"
# allowed_read_roots = ["~/.dotfiles/gemini/skills"]

[[repos]]
name = "example"
path = "."
