# GoReleaser configuration for vantage.
#
# Builds the `vantage` binary for linux and darwin (amd64 + arm64) with the
# Vite frontend embedded, attaches the archives to a GitHub release, and
# updates the Homebrew tap (mschulkind-oss/tap, formula "vantage").
version: 2

# The frontend is built once up front and copied into web/dist so the
# `//go:embed all:dist` directive in web/embed.go picks up the real bundle
# before any `go build` runs.
before:
  hooks:
    - bash -c "cd frontend && npm ci && npm run build"
    - bash -c "rm -rf web/dist && cp -r frontend/dist web/dist"

builds:
  - id: vantage
    main: ./cmd/vantage
    binary: vantage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mschulkind-oss/vantage/internal/buildinfo.version={{ .Version }}
      - -X github.com/mschulkind-oss/vantage/internal/buildinfo.commit={{ .ShortCommit }}

archives:
  - id: vantage
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: mschulkind-oss
    name: vantage

brews:
  - name: vantage
    repository:
      owner: mschulkind-oss
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/mschulkind-oss/vantage
    description: Beautiful local Markdown viewer with live reload and Git awareness
    license: Apache-2.0
    commit_author:
      name: vantage release bot
      email: noreply@github.com
    test: |
      assert_match "vantage", shell_output("#{bin}/vantage --version")
    install: |
      bin.install "vantage"
