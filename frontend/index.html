<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The 🔭 from vantageapp.dev, inline for the same reason the site does it
         that way: a data URI needs no asset to be served, so it survives the
         static export and the embedded bundle without either having to know
         about it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔭</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/index.css" />
    <title>Vantage</title>
  </head>
  <body>
    <!-- React replaces this content on its first render. Keep it independent
         of external CSS and JS so a failed bundle load never leaves a blank tab. -->
    <div id="root">
      <div
        style="
          padding: 2rem;
          font:
            1rem/1.5 system-ui,
            sans-serif;
        "
      >
        <p>Loading Vantage…</p>
        <p>
          If loading doesn't finish, reload this page to get the latest app.
        </p>
        <button type="button" onclick="window.location.reload()">
          Reload this page
        </button>
        <noscript
          ><p>
            Enable JavaScript in your browser, then reload this page.
          </p></noscript
        >
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
